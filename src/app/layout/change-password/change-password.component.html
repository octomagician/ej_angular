<app-simple-card title="Cambiar Contraseña">
    <form (ngSubmit)="onSubmit()" #passwordForm="ngForm" (input)="onInputChange()">
      <!-- Añade (input)="onInputChange()" al form -->
      
      <div class="mb-3">
        <label class="form-label">Contraseña Actual</label>
        <input type="password" class="form-control" 
               [(ngModel)]="currentPassword" name="currentPassword" required
               (input)="onInputChange()"> <!-- Añade esto a cada input -->
      </div>
  
      <div class="mb-3">
        <label class="form-label">Nueva Contraseña</label>
        <input type="password" class="form-control" 
               [(ngModel)]="newPassword" name="newPassword" required
               (input)="onInputChange()"> <!-- Añade esto -->
      </div>
  
      <div class="mb-3">
        <label class="form-label">Confirmar Nueva Contraseña</label>
        <input type="password" class="form-control" 
               [(ngModel)]="confirmPassword" name="confirmPassword" required
               (input)="onInputChange()"> <!-- Añade esto -->
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" 
                [disabled]="!passwordForm.form.valid || loading">
          <span *ngIf="!loading">Cambiar Contraseña</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm"></span>
            Procesando...
          </span>
        </button>
      </div>
    </form>
  </app-simple-card>
