<div class="item-list container mt-4">
    <h1 class="mb-4">Listado de Usuarios</h1>
  
    <div class="d-flex justify-content-between align-items-center mb-4">
        <!-- Buscador -->
        <div class="search">
            <input
                type="number"
                class="form-control"
                [(ngModel)]="searchId"
                placeholder="Buscar por ID"
                (input)="searchItem()"
                min="0"
            />
        </div>
  
      <!-- Botón para crear -->
      <div *ngIf="isAdminUser" class="actions">
        <button class="btn btn-primary" (click)="goToCreate()"><span class="material-icons">add</span></button>
    </div>
  
    <!-- Paginación-->
    <div class="d-flex justify-content-center mb-3">
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="changePage($event)"
      ></app-pagination>
    </div>
    </div>
  
    <table class="table table-striped table-bordered table-hover">
      <thead class="thead-dark">
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Nombre Completo</th>
          <th *ngIf="isAdminUser">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of displayedUsers">
          <td>{{ user.id }}</td>
          <td>{{ user.email }}</td>
          <td>
            {{ user.persona?.nombre }} {{ user.persona?.apellido_paterno }} {{ user.persona?.apellido_materno }}
          </td>
          <td *ngIf="isAdminUser">
            <button class="btn btn-warning" (click)="editItem(user.id)">
              <span class="material-icons">edit</span>
            </button>
            <button class="btn btn-danger" (click)="deleteItem(user.id)">
              <span class="material-icons">delete</span>
            </button>
          </td>
        </tr>
        <tr *ngIf="displayedUsers.length === 0">
          <td colspan="5" class="text-center">No se encontraron usuarios</td>
        </tr>
      </tbody>
    </table>
  </div>
