<div class="container mt-4">
  <h1>{{ isEditMode ? 'Editar Usuario' : 'Crear Usuario' }}</h1>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <label>Nombre *</label>
      <input type="text" class="form-control" formControlName="nombre" />
    </div>

    <div class="form-group mb-3">
      <label>Apellido Paterno *</label>
      <input type="text" class="form-control" formControlName="apellido_paterno" />
    </div>

    <div class="form-group mb-3">
      <label>Apellido Materno</label>
      <input type="text" class="form-control" formControlName="apellido_materno" />
    </div>

    <div class="form-group mb-3">
      <label>Sexo *</label>
      <select class="form-select" formControlName="sexo">
        <option value="">Seleccione...</option>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>
    </div>

    <div class="form-group mb-3">
      <label>Username *</label>
      <input type="text" class="form-control" formControlName="username" />
    </div>

    <div class="form-group mb-3">
      <label>Email *</label>
      <input type="email" class="form-control" formControlName="email" />
    </div>

    <div class="form-group mb-3">
      <label>Tipo de Usuario *</label>
      <input type="number" class="form-control" formControlName="tipo_id" />
    </div>

    <div class="form-group mb-3">
      <label>Contraseña</label>
      <input type="password" class="form-control" formControlName="password" />
    </div>

    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary" [disabled]="usuarioForm.invalid">
        {{ isEditMode ? 'Guardar Cambios' : 'Crear Usuario' }}
      </button>
    </div>
  </form>
</div>
